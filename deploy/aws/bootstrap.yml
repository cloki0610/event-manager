AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  event-manager one-time bootstrap. The ECR repository and the role GitHub Actions assumes
  (via OIDC, no stored keys) to push images and deploy the service stack.

Parameters:
  GitHubRepo:
    Type: String
    Default: cloki0610/event-manager
    Description: owner/name of the repository allowed to deploy.
  DeployEnvironment:
    Type: String
    Default: production
    Description: GitHub environment the deploy job runs in. Only that job can assume the role.
  ServiceStackName:
    Type: String
    Default: event-manager
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: event-manager
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
            "action":{"type":"expire"}}]}

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # CloudFormation assumes this role to create the service stack's resources, so the role
  # GitHub holds never needs those permissions itself.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-service-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ServiceStackName}-*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${DeployEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceStackName}/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub environment.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Set as the AWS_CFN_EXECUTION_ROLE_ARN variable of the GitHub environment.
    Value: !GetAtt CloudFormationExecutionRole.Arn
