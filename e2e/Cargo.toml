[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
chrono = "0.4"
openidconnect = { version = "4", default-features = false }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cookie = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
