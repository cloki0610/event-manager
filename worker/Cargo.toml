[package]
name = "event-manager"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
# getrandom 0.2 (through openidconnect's rand) needs `js` to find crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
openidconnect = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
worker = { version = "0.8.7", features = ["d1"] }
