name: CI

# Pushes to main run this through deploy.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WORKER_BUILD_VERSION: 0.8.7

jobs:
  check:
    name: fmt, clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p event-manager --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy -p e2e --all-targets --locked -- -D warnings

  e2e:
    name: API tests (wrangler dev + local D1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo install worker-build --locked --version "$WORKER_BUILD_VERSION"
      - run: cargo test -p e2e --locked
