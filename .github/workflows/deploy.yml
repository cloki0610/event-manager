name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    # Configure under Settings > Environments > production; add required reviewers to gate releases.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STACK_NAME: event-manager
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/event-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy service stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file deploy/aws/service.yml \
            --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=${{ steps.ecr.outputs.registry }}/event-manager:${{ github.sha }}" \
              "VpcId=${{ vars.VPC_ID }}" \
              "SubnetIds=${{ vars.SUBNET_IDS }}" \
              "CertificateArn=${{ vars.CERTIFICATE_ARN }}" \
              "PublicUrl=${{ vars.PUBLIC_URL }}" \
              "OidcIssuerUrl=${{ vars.OIDC_ISSUER_URL }}" \
              "OidcClientId=${{ vars.OIDC_CLIENT_ID }}" \
              "OidcClientSecretArn=${{ vars.OIDC_CLIENT_SECRET_ARN }}" \
              "PostLoginRedirect=${{ vars.POST_LOGIN_REDIRECT }}"

      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "$url/events?limit=1"
