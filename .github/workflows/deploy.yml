name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    # Configure under Settings > Environments > production; add required reviewers to gate releases.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      POST_LOGIN_REDIRECT: ${{ vars.POST_LOGIN_REDIRECT }}
      SESSION_TTL_HOURS: ${{ vars.SESSION_TTL_HOURS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::error::Set database_id in wrangler.toml (npx wrangler d1 create event-manager)"
            exit 1
          fi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_URL OIDC_ISSUER_URL OIDC_CLIENT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set for the production environment"; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo install worker-build --locked --version 0.8.7

      # Migrations go first, so they must stay compatible with the code that is still live.
      - run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: |
          vars=(--var "OIDC_ISSUER_URL:$OIDC_ISSUER_URL" --var "OIDC_CLIENT_ID:$OIDC_CLIENT_ID"
                --var "OIDC_REDIRECT_URL:${PUBLIC_URL%/}/auth/callback")
          [ -n "$POST_LOGIN_REDIRECT" ] && vars+=(--var "POST_LOGIN_REDIRECT:$POST_LOGIN_REDIRECT")
          [ -n "$SESSION_TTL_HOURS" ] && vars+=(--var "SESSION_TTL_HOURS:$SESSION_TTL_HOURS")
          npx wrangler deploy "${vars[@]}"

      - name: Smoke test
        run: |
          echo "### Deployed to $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${PUBLIC_URL%/}/events?limit=1"
